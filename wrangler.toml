name = "gflow-telemetry"
main = "src/index.ts"
account_id = "6e84ee0d4c899e5b5fa648302e0bfba9"
workers_dev = true
compatibility_date = "2026-10-01"

# No per-request logs: observability off, no logpush, no console output of request data.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "gflow-telemetry"
database_id = "4dd3ffe8-e5cb-4ed6-95c0-60a817c893ee"
migrations_dir = "migrations"

[vars]
# Server-side stop: any value other than "0" answers 410 to every request.
STOPPED = "0"
